name: Vyne
description: 'Vyne was a London-based account-to-account (A2A) open banking payments platform,
  founded in 2019. It offered merchants real-time pay-by-bank payments, instant refunds,
  no-code payment links and verified payouts, built on open banking rails and real-time
  ACH networks with in-app biometric SCA across the UK and Europe. Vyne served retail,
  financial services and automotive merchants and won Best Open Banking Payments Project
  at the Open Banking Expo Awards 2023. In September 2024 Vyne was acquired by Dubai-based
  open banking platform Tarabut, and it wound down its UK operations effective 22 April 2025.
  The payvyne.com domain has since been repurposed to an unrelated site, and Vyne no longer
  operates a public developer portal, API reference or OpenAPI surface. This profile is
  retained as a historical record; there is no live API to enrich.'
